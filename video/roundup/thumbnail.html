<!doctype html>
<!--
  FILE: thumbnail.html
  PATH: video/roundup/thumbnail.html

  Roundup thumbnail, 1280x720 (brand/components/Thumbnail): cinema-black, ring motif,
  uppercase headline bottom-left, kicker, white mark bottom-right and the signature outline
  (signal-magenta, 14px inset). render.mjs injects window.THUMB = {headline, kicker, outline}.
  outline "none" renders the control version for the click-through test.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=block">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #07080a; }
.f { position: relative; width: 1280px; height: 720px; overflow: hidden; background: radial-gradient(900px 700px at 85% 10%, #0f1a12 0%, #07080a 60%); }
.rings { position: absolute; right: -230px; top: -260px; width: 760px; height: 760px; }
.rings i { position: absolute; inset: 0; border-radius: 50%; border: 4px solid #046937; }
.rings i:nth-child(2) { inset: 120px; border-color: #4db748; opacity: .7; }
.rings i:nth-child(3) { inset: 240px; border-color: #c2b59b; opacity: .35; }
.k { position: absolute; left: 90px; bottom: 330px; font: 600 34px/1 "Big Shoulders Display", sans-serif; letter-spacing: 7px; text-transform: uppercase; color: #c2b59b; }
.k::before { content: ""; display: block; width: 110px; height: 7px; background: #4db748; margin-bottom: 22px; }
.h { position: absolute; left: 90px; bottom: 70px; width: 800px; font: 800 132px/.9 "Big Shoulders Display", sans-serif; letter-spacing: .5px; text-transform: uppercase; color: #fff; }
.mark { position: absolute; right: 70px; bottom: 70px; width: 104px; }
.outline { position: absolute; inset: 0; border: 14px solid var(--outline, #ff2e93); pointer-events: none; }
</style>
</head>
<body>
<div class="f">
	<div class="rings"><i></i><i></i><i></i></div>
	<div class="k" id="k"></div>
	<div class="h" id="h"></div>
	<img class="mark" src="../../brand/assets/Logos/dp-mark-white.svg" alt="">
	<div class="outline" id="o"></div>
</div>
<script>
(async function () {
	const t = window.THUMB || { headline: 'What 54 channels covered this week', kicker: 'Weekly roundup', outline: '#ff2e93' };
	document.getElementById('h').textContent = t.headline;
	document.getElementById('k').textContent = t.kicker;
	const o = document.getElementById('o');
	if (t.outline === 'none') o.remove(); else o.style.setProperty('--outline', t.outline);
	await document.fonts.ready;
	const h = document.getElementById('h');
	let size = 132;
	while (h.scrollHeight > size * 0.9 * 2 + 4 && size > 70) { size -= 4; h.style.fontSize = size + 'px'; }
	window.__ready = true;
})();
</script>
</body>
</html>
